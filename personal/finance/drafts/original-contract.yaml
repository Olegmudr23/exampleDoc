openapi: 3.0.4
info:
  title: Сервис учета личных финансов
  description: В рамках обучения через терни к звездам
  termsOfService: 'https://example.com/terms/'
  contact:
    email: student@example.com
  license:
    name: Учебный проект
    url: 'https://www.example.org/licenses/LICENSE-2.0.html'
  version: 1.0.0
servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://mock.example.com/finance/v1
  - url: 'https://dev.example.com/'
    description: Dev стенд
